<style>
  :root { --bg: #0f111a; --card: #1e212b; --text: #e2e8f0; --accent: #10b981; --border: #2d3748; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 2rem; margin: 0; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  .kpi-container { display: flex; gap: 1rem; margin-bottom: 2rem; max-width: 600px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; flex: 1; text-align: center; }
  .kpi-value { font-size: 2rem; font-weight: bold; color: var(--accent); }
  .filters { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
  .filter-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer; transition: 0.2s;}
  .filter-btn:hover, .filter-btn.active { border-color: var(--accent); background: #2d3748; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
  .title { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.25rem 0; }
  .company { font-size: 0.9rem; color: #94a3b8; }
  .match { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
  .tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
  .tag { background: #2d3748; font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 4px; }
  .description { font-size: 0.85rem; color: #cbd5e1; flex-grow: 1; margin-bottom: 1.5rem; line-height: 1.5; }
  .apply-btn { text-align: center; background: #0077b5; color: white; text-decoration: none; padding: 0.5rem; border-radius: 6px; font-weight: 500; display: block;}
  .summary-text { color: #94a3b8; margin-bottom: 1.5rem; font-size: 0.9rem;}
</style>

let currentFilter = 'All';

function renderJobs() {
  // 1. Get any manually saved jobs from localStorage (if you used the UI importer)
  let customJobs = [];
  try {
    customJobs = JSON.parse(localStorage.getItem('custom_jobs')) || [];
  } catch (e) {
    console.error("Error reading localStorage");
  }

  // 2. Merge GitHub jobs with customJobs & Deduplicate by Job Title + Company
  const allJobs = [...initialJobs, ...customJobs];
  const uniqueJobs = [];
  const seen = new Set();
  
  allJobs.forEach(job => {
    const key = job.title + "|" + job.company;
    if (!seen.has(key)) {
      seen.add(key);
      uniqueJobs.push(job);
    }
  });

  // 3. Filter the jobs based on the current button selection
  const filteredJobs = uniqueJobs.filter(job => {
    if (currentFilter === 'All') return true;
    return job.source === currentFilter;
  });

  // 4. THIS IS THE FIX: Dynamically update the UI Counters
  document.getElementById('kpiTotalListings').innerText = uniqueJobs.length;
  document.getElementById('countAllBadge').innerText = uniqueJobs.length;
  
  const sourceText = currentFilter === 'All' ? 'across HiringCafe & LinkedIn' : `from ${currentFilter}`;
  document.getElementById('activeFilterSummary').innerText = `Displaying ${filteredJobs.length} roles ${sourceText}`;

  // 5. Render HTML Cards
  const board = document.getElementById('board');
  board.innerHTML = '';
  
  filteredJobs.forEach(job => {
    board.innerHTML += `
      <div class="card">
        <div class="card-top">
          <div>
            <h2 class="title">${job.title}</h2>
            <div class="company">${job.company}</div>
          </div>
          <div class="match">${job.match}%</div>
        </div>
        <div class="tags">
          <span class="tag" style="background: #2563eb;">${job.source}</span>
          <span class="tag" style="background: #475569;">${job.ats}</span>
          ${job.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <div class="description">${job.desc}</div>
        <a href="${job.url}" target="_blank" class="apply-btn">View & Apply</a>
      </div>
    `;
  });
}

function filterJobs(source) {
  currentFilter = source;
  
  // Update active styling on the buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.innerText.includes(source) || (source === 'All' && btn.innerText.includes('All'))) {
      btn.classList.add('active');
    }
  });
  
  renderJobs();
}

// Trigger the render immediately when the page loads
window.onload = () => {
  renderJobs();
};
